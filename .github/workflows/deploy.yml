name: 🚀 Deploy File to VPS via SSH

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch

jobs:
  deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: 🔨 Install Dependencies and Build
        run: |
          npm install --force
          npm install axios --save
          npm run build
        env:
          CI: false

      - name: 📂 Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}  # Your VPS IP or hostname
          username: ${{ secrets.SERVER_USER }}  # SSH username (e.g., root)
          key: ${{ secrets.SERVER_SSH_KEY }}  # SSH private key
          port: 22  # SSH port (default is 22)
          script: |
            cd /var/www/admin.lovebird4u.com || exit 1
            rm -rf *  # Remove all existing files
            scp -r ~/build/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/admin.lovebird4u.com || exit 1
            pm2 restart lovebird-admin-site || exit 1
            pm2 save || exit 1
