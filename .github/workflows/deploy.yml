name: 🚀 Deploy File to VPS via SSH

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch

jobs:
  deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📂 Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Remove the existing project directory if it exists
            rm -rf /var/www/admin.lovebird4u.com/code || exit 1

            # Recreate the project directory
            mkdir -p /var/www/admin.lovebird4u.com/code || exit 1

            # Clone the repository into the newly created directory
            git clone https://github.com/malitha23/DatingApp-Lovebirds-Flutter-Admin-Site.git /var/www/admin.lovebird4u.com/code || exit 1

            cd /var/www/admin.lovebird4u.com/code || exit 1

            # Install dependencies and build the project on the server
            npm install || exit 1
            npm run build || exit 1
