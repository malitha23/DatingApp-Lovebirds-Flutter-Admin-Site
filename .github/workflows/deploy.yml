name: 🚀 Deploy File to VPS via SSH

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch

jobs:
  deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: 🔨 Install Dependencies and Build
        run: |
          mkdir -p build-output
          npm install --force
          npm install axios --save
          npm run build
          mv build/* build-output/
        env:
          CI: false

      - name: Verify Build Output
        run: ls -la build-output

      - name: 📂 Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Navigate to the project directory on the server and create directories if needed
            mkdir -p /var/www/admin.lovebird4u.com/code || exit 1

            # Check if the directory is a Git repository
            if [ ! -d ".git" ]; then
              echo "Directory is not a Git repository. Cloning repository..."
              # Clone the repository if not already present
              git clone https://github.com/malitha23/DatingApp-Lovebirds-Flutter-Admin-Site.git /var/www/admin.lovebird4u.com/code || exit 1
            fi

            cd /var/www/admin.lovebird4u.com/code || exit 1

            # Pull the latest code from the repository
            git pull || exit 1
            
            # Install dependencies and build the project on the server
            npm install || exit 1
            npm run build || exit 1
            
