name: 🚀 Deploy File to VPS using SSH

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch

jobs:
  deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetch latest 2 commits to ensure history

      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Set Node.js version to 16

      - name: Cache npm dependencies
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  # Cache based on OS and lock file

      - name: 🔨 Install Dependencies and Build
        run: |
          npm install --force  # Install all dependencies with --force flag
          npm install axios --save  # Install axios as a dependency
          npm run build  # Run build command (ensure this is defined in package.json)
        env:
          CI: false  # Disable CI flag to avoid failing on warnings

      - name: 📂 Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}  # Your VPS IP or hostname
          username: ${{ secrets.SERVER_USER }}  # SSH username (e.g., root)
          key: ${{ secrets.SERVER_SSH_KEY }}  # SSH private key
          port: 22  # SSH port (default is 22)
          script: |
            cd /var/www/lovebird4u.com/DatingAppFlutter-Backend
            git pull  # Pull latest changes from the repository
            npm install  # Install/update dependencies
            pm2 restart lovebird-backend  # Restart the backend service with PM2
            pm2 save  # Save PM2 process list

      - name: 🗑️ Clean up Node modules
        run: |
          rm -rf node_modules
