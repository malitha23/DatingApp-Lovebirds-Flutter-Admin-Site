name: 🚀 Deploy File to Server via SSH

on:
  push:
    branches:
      - main

jobs:
  SSH-Deploy-Action:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: 🔨 Install Dependencies and Build
        run: |
          npm install --force
          npm install axios --save
          npm run build
        env:
          CI: false

      - name: List Build Directory Contents
        run: |
          echo "Contents of the build directory:"
          ls -R build

      - name: 📂 Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/admin.lovebird4u.com || exit 1
            echo "Removing old files in the server directory..."
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            echo "Starting rsync file transfer..."
            scp -r ~/build/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/admin.lovebird4u.com
     

